name: Hourly Today Meta Report

on:
  workflow_dispatch:

  schedule:
    - cron: "37 * * * *"
      timezone: "Africa/Cairo"

permissions:
  contents: read

concurrency:
  group: hourly-today-meta-report
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Show trigger information
        run: |
          echo "Triggered by: $GITHUB_EVENT_NAME"
          echo "Current UTC time:"
          date -u

      - name: Fetch Today data and send WhatsApp report
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: ${{ secrets.META_API_VERSION }}
          BUSINESS_IDS: ${{ secrets.BUSINESS_IDS }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_REPORT_TO: ${{ secrets.WHATSAPP_REPORT_TO }}
          REPORT_TIMEZONE: "Africa/Cairo"
          MAX_WORKERS: "4"
        run: python scheduled_report.py
